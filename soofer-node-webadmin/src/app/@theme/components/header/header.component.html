<div class="header-container" [class.left]="position === 'normal'" [class.right]="position === 'inverse'">
  <div class="logo-containter">
    <a (click)="toggleSidebar()" href="#" class="navigation"><i class="nb-menu"></i></a>
    <div class="logo" (click)="goToHome()">
      <img *ngIf="showLogo" src="{{ logoUrl }}" alt="img" height="{{ logoHeight }}" width="{{ logoWidth }}"
        class="user-picture image" />
      <span *ngIf="showTitle">{{ title }}</span>
    </div>
  </div>
  <!-- <ngx-theme-switcher></ngx-theme-switcher> -->
</div>

<div class="header-container">
  <!-- <ngx-layout-direction-switcher></ngx-layout-direction-switcher> -->
  <nb-actions size="medium" [class.right]="position === 'normal'" [class.left]="position === 'inverse'">
    <!-- <nb-action icon="nb-gear" class="toggle-layout" (click)="toggleSettings()"></nb-action> -->
    <nb-action>
      <nb-user [nbContextMenu]="userMenu" [name]="user?.name" [picture]="user?.picture"></nb-user>
    </nb-action>
    <nb-action class="control-item" icon="nb-notifications" (click)="routeToNotification()"></nb-action>
    <nb-action class="control-item" icon="nb-email" (click)="routeToEmail()"></nb-action>
    <!-- badgeText="{{mailNumber}}" -->
    <nb-action class="control-item">
      <nb-search type="rotate-layout" (click)="startSearch()"></nb-search>
    </nb-action>
    <!-- <nb-action size="medium" [class.right]="position === 'normal'" [class.left]="position === 'inverse'"
      *ngIf="showTransOption">
      <select #langSelect (change)="translate.use(langSelect.value)">
        <option *ngFor="let list of translate.getLangs()" [value]="list" [selected]="list === translate.currentLang">
          {{ list }}</option>
      </select>
    </nb-action> -->
  </nb-actions>
</div>
