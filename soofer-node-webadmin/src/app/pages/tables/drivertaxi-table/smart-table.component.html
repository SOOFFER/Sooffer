<div class="row">
  <div class="col-md-9">
    <nb-card>
      <nb-card-body>
        <div class="map" #map></div>
      </nb-card-body>
    </nb-card>
  </div>
  <div class="col-md-3">
    <nb-card>
      <nb-card-body>
        <div class="form-group">
          <b>Start:</b> &nbsp;
          <select id="start" name="startLoc" [(ngModel)]="list.startLoc" #startLoc="ngModel">
            <option value="Chennai, IN">Chennai, India</option>
          </select>
        </div>
        &nbsp;
        <div class="form-group">
          <b>Waypoints:</b> <br>
          <select multiple id="waypoints" name="wayPts" [(ngModel)]="list.wayPts" #wayPts="ngModel">
            <option value="use">Areas in Chennai</option>
          </select>
        </div>
        <div class="form-group">
          <b>End:</b>
          &nbsp;
          <select id="end" name="endLoc" [(ngModel)]="list.endLoc" #endLoc="ngModel">
            <option value="Mahabalipuram, IN">Mahabalipuram, India</option>
          </select>
        </div>
        &nbsp;
        <div class="form-group">
          <button type="submit" class="btn btn-primary" (click)="clicked()"> Submit </button>
        </div>
        &nbsp;
        <div id="directions-panel"></div>
      </nb-card-body>
    </nb-card>
  </div>
</div>

<style>
  .map {
    margin: 10px 0;
    height: 650px;
    max-width: 100%;
  }

  #right-panel select,
  #right-panel input {
    font-size: 15px;
  }

  #right-panel select {
    width: 100%;
  }

  #right-panel i {
    font-size: 12px;
  }

  #right-panel {
    margin: 6px;
    border-width: 2px;
    width: 100%;
    height: 500px;
    float: left;
    text-align: left;
    padding-top: 0;
  }

  #directions-panel {
    margin-top: 10px;
    background-color: #FFEE77;
    padding: 10px;
    overflow: scroll;
    height: 174px;
  }

</style>
