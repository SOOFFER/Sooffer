<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-md-2">
        {{title}}
      </div>
      <div class="col-md-10">
        <form #dateForm="ngForm" class="form-inline">
          From: &nbsp;
          <!-- <input type="date" #fromDate  required class="form-control"/> -->
          <input class="form-control" placeholder="Click to Select a Date" (dateTimeInput)="logDate($event)"
            [(ngModel)]="list.fromDate" name="fromDate" #fromDate="ngModel" [owlDateTimeTrigger]="dt1"
            [owlDateTime]="dt1" required>
          <owl-date-time [pickerType]="'calendar'" #dt1></owl-date-time>
          &nbsp; To: &nbsp;
          <!-- <input type="date" #toDate required class="form-control"/> -->

          <input class="form-control" placeholder="Click to Select a Date" (dateTimeInput)="logDate($event)"
            [(ngModel)]="list.toDate" name="toDate" #toDate="ngModel" [owlDateTimeTrigger]="dt2" [owlDateTime]="dt2"
            required>
          &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
          <select class="form-control" *ngIf="showCity==true" [(ngModel)]="list.servicecity" name="servicecity"
            #servicecity="ngModel" required placeholder="Service">
            <option [value]="undefined" selected hidden>
              Select a ServiceCity</option>
            <option *ngFor="let city of serviceCityArray" [value]="city.label">
              {{city.label}}
            </option>
            <option value="all">All</option>
          </select>
          <owl-date-time [pickerType]="'calendar'" #dt2></owl-date-time>&nbsp;&nbsp;
          <button type="button" (click)="filterRes(list)" class="btn btn-danger">Submit</button>&nbsp;&nbsp;
          <!-- <button type="button" (click)="export()" class="btn btn-primary">Export</button> -->
          <!-- <nb-select placeholder="Export ">
            <nb-option value="csv">CSV</nb-option>
            <nb-option value="excel" disabled>Excel</nb-option>
          </nb-select> -->
          <select class="form-control" name="exp" [(ngModel)]="exportInp.exp" #exp="ngModel" (change)="export($event)">
            <option value="undefined" selected hidden>Export</option>
            <option value="csv">Csv</option>
            <option value="excel">Excel</option>
          </select>
        </form>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ng2-smart-table [settings]="settings" [source]="source" *ngIf="source">
    </ng2-smart-table>
  </nb-card-body>
</nb-card>
