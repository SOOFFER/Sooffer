                        </div>

    <nb-card>
        <nb-card-header>
            Request Config
        </nb-card-header>
        <nb-card-body>
            <div class="row">
                <div class="col-md-6">
                    <nb-card>
                        <nb-card-header>
                                <div class="form-group">
                                        <label><b> Max Request Radius(In Miles) (Distance b/t Pickup point and Driver Location) </b></label>
                                    </div>
                        </nb-card-header>
                        <nb-card-body>
                                <div class="row">
                                        <div class="col-md-4">
                                                <label>
                                                    Daily
                                                </label>
                                                <input type="number" class="form-control" placeholder="Daily" name="maxDistBtRiderAndDriver" 
                                                [(ngModel)]="list.maxDistBtRiderAndDriver" #maxDistBtRiderAndDriver="ngModel">
                                            </div>
                                            <div class="col-md-4">
                                                 <label>Outstation</label>
                                                 <input type="number" class="form-control" placeholder="Outstation" name="maxDistBtRiderAndDriverOutsation" 
                                                 [(ngModel)]="list.maxDistBtRiderAndDriverOutsation" #maxDistBtRiderAndDriverOutsation >
                                            </div>
                                            <div class="col-md-4">
                                                <label>Rental</label>
                                                <input type="number" class="form-control" placeholder="Rental" name="maxDistBtRiderAndDriverRental" 
                                                [(ngModel)]="list.maxDistBtRiderAndDriverRental" #maxDistBtRiderAndDriverRental="ngModel"> 
                                            </div>
                                </div>
                        </nb-card-body>
                        <br>
                    </nb-card>
                </div>
                <div class="col-md-6">
                    <nb-card>
                        <nb-card-header>
                                <div class="form-group">
                                        <label><b> Max Request Radius(In Miles) (Distance b/t Pickup point and Driver Location) </b></label>
                                    
                                    </div>
                        </nb-card-header>
                        <nb-card-body>
                                <div class="row">
               
                                            <div class="col-md-4">
                                                <label>Daily</label>
                                                <input type="number" class="form-control" placeholder="Daily" name="requestTime"
                                                [(ngModel)]="list.requestTime" #requestTime="ngModel">
                                            </div>
                                            <div class="col-md-4">
                                                <label>Outstation</label>
                                                <input type="number" class="form-control" placeholder="Outstation" name="requestTimeOutsation"
                                                [(ngModel)]="list.requestTimeOutsation" #requestTimeOutsation="ngModel"> 
                                                
                                            </div>
                                            <div class="col-md-4s">
                                                <label>Rental</label>
                                                <input type="number" class="form-control" placeholder="Rental" name='requestTimeRental'
                                                [(ngModel)]="list.requestTimeRental" #requestTimeRental="ngModel"> 
                                            </div>     
                            </div>
                        </nb-card-body><br>
                    </nb-card>
                </div>
            </div>
 
            <br>
            <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                        <label>No Of Drivers to be Cancelled Nearby Pickup Point</label>
                        <input type="number" name="driversNeedToCallForATrip" #driversNeedToCallForATrip="ngModel"
                        [(ngModel)]="list.driversNeedToCallForATrip" placeholder="No of Drivers to be Called Nearby Pickup Point"
                        class="form-control"> 
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Requesting Time For Rider To Search for Nearby Driver (seconds) </label>
                        <input type="number" name="userCancelTime" #userCancelTime="ngModel" [(ngModel)]="list.userCancelTime"
                        placeholder="Requesting Time For Rider to Search for Nearby Drivers" class="form-control">
                    </div>
                </div>
            </div>

  
        </nb-card-body>
        <nb-card-footer>
                <button type="submit" [disabled]="!dataForm.valid" class="btn btn-info" (click)="AddData(list)">Add</button>
            </nb-card-footer>
        </nb-card>
    </nb-card>
