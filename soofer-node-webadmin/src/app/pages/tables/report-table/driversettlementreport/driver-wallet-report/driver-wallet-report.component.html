<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-md-6">
        Wallet Details &nbsp; | &nbsp; Driver: {{list.driverName}}
      </div>
      <div class="col-md-6">
        <label class="pull-right"> <b> Wallet Balance : {{list.wallet}} &nbsp; </b> </label>
      </div>
    </div>
  </nb-card-header>
  <nb-card-header style="text-align: center">
    <div class="row" style="display: inline-block">
      <div class="col-md-12">
        <form #dateForm="ngForm" class="form-inline">
          From: &nbsp;
          <!-- <input type="date" #fromDate  required class="form-control"/> -->
          <input nbInput fieldSize="small" class="form-control" placeholder="Click to Select a Date"
            (dateTimeInput)="logDate($event)" [(ngModel)]="list.fromDate" name="fromDate" #fromDate="ngModel"
            [owlDateTimeTrigger]="dt1" [owlDateTime]="dt1" required>
          <owl-date-time [pickerType]="'calendar'" #dt1></owl-date-time>
          &nbsp; To: &nbsp;
          <!-- <input type="date" #toDate required class="form-control"/> -->
          <input nbInput fieldSize="small" class="form-control" placeholder="Click to Select a Date"
            (dateTimeInput)="logDate($event)" [(ngModel)]="list.toDate" name="toDate" #toDate="ngModel"
            [owlDateTimeTrigger]="dt2" [owlDateTime]="dt2" required>
          <owl-date-time [pickerType]="'calendar'" #dt2></owl-date-time>&nbsp;&nbsp;
          <button type="button" nbButton size="xsmall" (click)="filterRes()"
            class="btn btn-danger">Submit</button>&nbsp;&nbsp;
          <!-- <button type="button" nbButton size="xsmall" (click)="export()" class="btn btn-danger">Export</button> -->
          <select class="form-control" name="exp" [(ngModel)]="exportInp.exp" #exp="ngModel" (change)="export($event)">
            <option value="undefined" selected hidden>Export</option>
            <option value="csv">Csv</option>
            <option value="excel">Excel</option>
          </select>
        </form>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ng2-smart-table [settings]="settings" [source]="source" *ngIf="source">
    </ng2-smart-table>
  </nb-card-body>
  <nb-card-footer>
    <button type="button" nbButton size="xsmall" (click)="goBack()" class="btn btn-info pull-left">Go back</button>
    <!-- <button type="button" (click)="export()" class="btn btn-primary pull-right">Export</button> -->
  </nb-card-footer>
</nb-card>
