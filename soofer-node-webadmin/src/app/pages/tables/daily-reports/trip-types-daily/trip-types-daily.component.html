<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-md-4">
        {{title}}
      </div>
      <div class="col-md-8">
        <form #dateForm="ngForm" class="form-inline">
          Filter By Date: &nbsp;
          <input class="form-control" placeholder="Click to Select a Date"
            (dateTimeInput)="logDate($event)" [(ngModel)]="list.fromDate" name="fromDate" #fromDate="ngModel"
            [owlDateTimeTrigger]="dt1" [owlDateTime]="dt1" required>
          <owl-date-time [pickerType]="'calendar'" #dt1></owl-date-time> &nbsp; &nbsp;

     
            <select  *ngIf = "showCity == true" name="servicecity" class="form-control" [(ngModel)]="list.servicecity" >
              <option value="undefined" selected hidden>Service Available City</option>
              <option [value]="city.label" *ngFor="let city of serviceCity">{{city.label}}</option>
              <option value="all" >All</option>
            </select>
            &nbsp;&nbsp;&nbsp;
            <button type="button"  (click)="filterRes(list)"
            class="btn btn-danger">Submit</button>
        </form>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ng2-smart-table [settings]="settings" [source]="source" *ngIf="source">
    </ng2-smart-table>
  </nb-card-body>
</nb-card>
