<nb-card>
    <nb-card-header>
        <div class="row">
            <div class="col-md-4">
                Driver Duty Report
            </div>
            <div class="col-md-6">
               <form #dateForm="ngForm" class="form-inline">
                   <label>Filter By Date :</label>&nbsp;
                   <input [owlDateTime]="dt1" [owlDateTimeTrigger]="dt1" placeholder="Click to Select a Date" class="form-control" name="date" [(ngModel)]="list.date">
                   <owl-date-time #dt1 pickerType="calendar"></owl-date-time>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                   <select class="form-control" *ngIf="showCity==true" [(ngModel)]="list.servicecity" name="servicecity">
                       <option value="undefined" selected hidden>Service Available City</option>
                       <option *ngFor="let city of ServiceCity" [value]= city.label>{{city.label}} </option>
                       <option value="all"> All</option> 
                   </select> 
               </form>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-primary" (click)="FilterByDate(list)">Submit</button>
            </div>
          
        </div>

     
    </nb-card-header>
    <nb-card-body>
            <ng2-smart-table [settings]="settings" [source]="source" (custom)="route($event)" ></ng2-smart-table>
    </nb-card-body>
</nb-card>
