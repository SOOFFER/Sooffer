<ng-template [ngIf]="initial==0">
  <nb-card>
    <nb-card-header>
      <div class="row">
        <div class="col-sm-10">
          {{title}}
        </div>
        <div class="col-sm-2">
          <button type="button" (click)="btBack(1)" class="btn btn-danger pull-right">Add Year</button>
        </div>
      </div>
    </nb-card-header>
    <nb-card-body>
      <ng2-smart-table [settings]="settings" [source]="source" (custom)="route($event)" *ngIf="source ">
      </ng2-smart-table>
    </nb-card-body>
  </nb-card>
</ng-template>
<ng-template [ngIf]="initial==1">
  <div class="row">
    <div class="col-sm-6">
      <nb-card>
        <nb-card-header>Add Year</nb-card-header>
        <nb-card-body>
          <form #dataForm1="ngForm">
            <!-- <div class="form-group">
									<label>
										Extension
									</label>
									<input type='text' required [(ngModel)]="list.ext" #ext="ngModel" name="ext" class="form-control" />

									<small class="form-text error" *ngIf="ext.invalid && (ext.dirty)">EXT is Mandatory!
									</small>
								</div>
								 -->
            <div class="form-group">
              <label>
                Vehicle Manufactured Year
              </label>
              <input type='text' placeholder="Enter Year" required [(ngModel)]="list.name" #year="ngModel" name="year"
                class="form-control" />
              <small class="form-text error" *ngIf="year.invalid && (year.dirty)">year is Mandatory!
              </small>
            </div>
          </form>
        </nb-card-body>
        <nb-card-footer>
          <button (click)="AddYear(list)" [disabled]="!dataForm1.form.valid" type="submit" class="btn btn-success">
            Add
          </button> &nbsp;
          <button (click)="btBack(0)" type="button" class="btn btn-info">
            Go Back
          </button>
        </nb-card-footer>
      </nb-card>
    </div>

  </div>
</ng-template>
<ng-template [ngIf]="initial==2">
  <div class="row">
    <div class="col-sm-6">
      <nb-card>
        <nb-card-header>Edit Year</nb-card-header>
        <nb-card-body>
          <form #dataForm2="ngForm">
            <div class="form-group">
              <label>
                Vehicle Manufactured Year
              </label>
              <input type='text' placeholder="Enter Year" required [(ngModel)]="selectedDocs.name" #year="ngModel"
                name="year" class="form-control" />
              <small class="form-text error" *ngIf="year.invalid && (year.dirty)">Year is Mandatory!
              </small>
            </div>
          </form>
        </nb-card-body>
        <nb-card-footer>
          <button (click)="updateyear(selectedDocs)" [disabled]="!dataForm2.form.valid" type="submit"
            class="btn btn-primary">
            Update
          </button> &nbsp;
          <button (click)="deleteyear(selectedid)" type="button" class="btn btn-danger">
            Delete
          </button> &nbsp;
          <button (click)="btBack(0)" type="button" class="btn btn-info">
            Go Back
          </button>
        </nb-card-footer>
      </nb-card>
    </div>

  </div>
</ng-template>
