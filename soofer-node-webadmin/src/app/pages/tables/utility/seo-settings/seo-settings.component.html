<div class="row">
  <div class="col-sm-6">
    <nb-card>
      <nb-card-header>Update Seo-Settings</nb-card-header>
      <nb-card-body>
        <form #dataForm="ngForm">
          <div class="form-group">
            <label>Keywords</label>
            <input type="text" name="keyword" #keyword="ngModel" [(ngModel)]="list.keyword" required
              placeholder="Keywords" class="form-control" />
            <small *ngIf="keyword.invalid && (keyword.dirty)" class="form-text error">
              Keywords is required!
            </small>
          </div>
          <div class="form-group">
            <label>Title Tag</label>
            <input type="text" [(ngModel)]="list.tag" #tag="ngModel" name="tag" required placeholder="Title Tag"
              class="form-control" />
            <small *ngIf="tag.invalid && (tag.dirty)" class="form-text error">
              Title Tag is required!
            </small>
          </div>
          <div class="form-group">
            <label>Meta Description</label>
            <textarea rows="5" [(ngModel)]="list.description" name="description" #description="ngModel"
              placeholder="Meta Description" class="form-control"></textarea>
            <small *ngIf="description.invalid && (description.dirty)" class="form-text error">
              Meta Description is required!
            </small>
          </div>
        </form>
        <button type="submit" (click)="AddNewDoc(list)" [disabled]="!dataForm.form.valid"
          class="btn btn-success btn-block">
          Update </button>
      </nb-card-body>
    </nb-card>
  </div>
</div>
