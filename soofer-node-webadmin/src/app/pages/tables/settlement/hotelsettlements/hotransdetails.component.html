<ng-template [ngIf]="initial ==1">
<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-md-6">
        Hotel Settlement Details
      </div>
      <div class="col-md-6">
        <label class="pull-right"> <b>  </b> </label>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ng2-smart-table [settings]="settings" [source]="source" (custom)="route($event)"  *ngIf="source">
    </ng2-smart-table>
  </nb-card-body>
  <nb-card-footer>
    <!-- <button type="button" (click)="goBack()" class="btn btn-info pull-left">Go back</button> -->
    <button type="button" (click)="export()" class="btn btn-primary pull-right">Export</button>
  </nb-card-footer>
</nb-card>
</ng-template>
<ng-template [ngIf]="initial ==2">
  <div class="row">
    <div class="col-lg-9">
      <nb-card>
        <nb-card-header>Add Payment
          <label class="pull-right"> <b>   Balance To Pay : {{list.amount}} &nbsp; </b> </label>
        </nb-card-header>
        <nb-card-body>
          <form #Form="ngForm">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>Transaction ID (<span class="red">*</span>)</label>
                  <input type="text" class="form-control" name="trxId" [(ngModel)]="list.trxId" #trxId="ngModel"
                    required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label>Driver Name</label>
                  <input type="text" class="form-control" name="fname" [(ngModel)]="list.fname" #fname="ngModel"
                    disabled required>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>Amount (<span class="red">*</span>)</label>
                  <input type="number" class="form-control" (focusout)="lesserThanZero($event)" [(ngModel)]="list.amt"
                    #amt="ngModel" name="amt" placeholder="Enter the Amount" required>
                  <small *ngIf="amt.invalid && (amt.dirty)" class="form-text error">
                    Amount is required!
                  </small>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label>Payment Type (<span class="red">*</span>)</label>
                  <ng-select name="type" placeholder="Select a Payment Type" notFoundMsg="No Payment Type Found"
                    [(ngModel)]="list.type" [options]="payment" [allowClear]="true" required>
                    <ng-template #optionTemplate let-option="option">
                      <span class="{{option.value}}">{{option.label}}</span>
                    </ng-template>
                  </ng-select>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>Description</label>
                  <textarea rows="5" [(ngModel)]="list.description" name="description" #description="ngModel"
                    placeholder="Enter the Description" class="form-control"></textarea>
                  <small *ngIf="description.invalid && (description.dirty)" class="form-text error">
                    Description is required!
                  </small>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label>Payment Date (<span class="red">*</span>)</label>
                  <ng-datepicker [(ngModel)]="list.paymentDate" [options]="visibleDateOptions" #paymentDate="ngModel"
                    name="paymentDate" class="form-control" required></ng-datepicker>
                  <small *ngIf="paymentDate.invalid && (paymentDate.dirty)" class="form-text error">
                    Payment Date is required!
                  </small>
                </div>
              </div>
            </div>
          </form>
        </nb-card-body>
        <nb-card-footer>
          <button (click)="btnClick(1)" class="btn btn-danger">go back</button> &nbsp; &nbsp;
          <button type="button" (click)="sendPayment(list)" [disabled]="!Form.valid" class="btn btn-success">Add</button>
        </nb-card-footer>
      </nb-card>
    </div>
  </div>
</ng-template>
<ng-template [ngIf]="initial ==3">
  <nb-card>
    <nb-card-header>
      <div class="row">
        <div class="col-md-6">
          Hotel Settlement Details
        </div>
        <div class="col-md-6">
          <label class="pull-right"> <b>   Balance : {{list.wallet}} &nbsp; </b> </label>
        </div>
      </div>
    </nb-card-header>
    <nb-card-body>
      <ng2-smart-table [settings]="settings" [source]="source" (custom)="route($event)"  *ngIf="source">
      </ng2-smart-table>
    </nb-card-body>
    <nb-card-footer>
      <!-- <button type="button" (click)="goBack()" class="btn btn-info pull-left">Go back</button> -->
      <button type="button" (click)="export()" class="btn btn-primary pull-right">Export</button>
    </nb-card-footer>
  </nb-card>
  </ng-template>
