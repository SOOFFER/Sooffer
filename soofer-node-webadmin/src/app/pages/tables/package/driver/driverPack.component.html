<ng-template [ngIf]="initial == 0">
    <nb-card>
        <nb-card-header>
            <div class="row">
                <div class="col-sm-10">
                  Driver Purchased Package List
                </div>
                <div class="col-sm-2">
                    <button type="button" (click)="btnClick(1);" class="btn btn-danger">Activate New Package</button>
                </div>
            </div>
        </nb-card-header>
        <nb-card-body>
            <ng2-smart-table [settings]="settings" [source]="source"  (deleteConfirm)="onDeleteConfirm($event)" *ngIf="source ">
            </ng2-smart-table>
        </nb-card-body>
    </nb-card>
</ng-template>
<ng-template [ngIf]="initial == 1">
    <form (ngSubmit)="AddNewDoc(list);" #dataForm1="ngForm">
        <div class="row">
            <div class="col-lg-6">
                <nb-card>
                    <nb-card-header>Activate New Package</nb-card-header>
                  
                    <nb-card-body>

                        <div class="form-group">
                            <label>Choose Driver</label>
                            <select class="form-control" [(ngModel)]="list.driverId" name="driverId" (change)="getDriverDetail($event);" required #driverId="ngModel" placeholder="driver">
                                <option>Select Driver</option>
                                <option *ngFor="let drivers of driverAry" [value]="drivers.id">
                                    {{drivers.name}}
                                </option>
                            </select>
                            
                            <small *ngIf="driverId.invalid && (driverId.dirty)" class="form-text error">
                                Driver is required!
                            </small>
                        </div>
                        <div class="form-group">
                            <label>Choose Package</label>
                            <select class="form-control" [(ngModel)]="list.packageId" name="packageId" (change)="getPakageDetail($event);"  required #packageId="ngModel" placeholder="package">
                                <option *ngFor="let pack of packAry" [value]="pack._id">
                                    {{pack.name}}
                                </option>
                            </select>
                            
                            <small *ngIf="packageId.invalid && (packageId.dirty)" class="form-text error">
                                Package name is required!
                            </small>
                        </div>
                        <button type="submit" [disabled]="!dataForm1.form.valid" class="btn btn-success">Submit</button>
                    </nb-card-body>
                    <nb-card-footer>
                        <button (click)="btnClick(0)" class="btn btn-primary">go back</button>
                    

                    </nb-card-footer>
                </nb-card>
            </div>
        </div>
    </form>
</ng-template>
