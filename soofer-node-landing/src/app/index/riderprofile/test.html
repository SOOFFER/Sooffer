                    <h3>My Profile</h3>
                    <br>

                            <i class="fa fa-pencil pencil-postn" data-toggle="modal" data-target="#exampleModal"></i>

                          <i class="fa fa-pencil pencil-postn" data-toggle="modal" data-target="#exampleModal"></i>-
                        </div> -->
                        </div>
                        <div class="col-lg-10 col-md-10 col-sm-10 col-xs-12 drve-profil-detail padding-leff-4">
                            <h5>{{SetDetail.fname}} {{SetDetail.lname}}</h5>
                            <p>{{SetDetail.gender}} | {{SetDetail.email}}</p>

                                <i class="fa fa-map-marker pading-right-1"></i>{{SetDetail.cityname}} | {{SetDetail.statename}} |
                                {{SetDetail.cntyname}}

                    <br>
