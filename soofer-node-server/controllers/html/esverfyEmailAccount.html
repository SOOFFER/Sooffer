<!DOCTYPE html>
<html>

<head>
    <title>Email Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- bootsrap3 link here -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <!-- <script src="http://code.jquery.com/jquery-1.9.1.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

</head>

<body>

    <!-- forget form start here -->
    <div class="container forget-form ">

        <h3>Email Verification</h3>

        <div id="success">
            <div class="alert alert-success">
                <strong>Verified Succesfully!</strong> <br> <span id="res"></span>
            </div>
        </div>

        <div id="error">
            <div class="alert alert-danger">
                <strong>Not Verified!</strong> <br> <span id="err"></span>
            </div>
        </div>

        <form id="searchForm">
            <p id="htmlid">{{url}}{{id}}</p>
            <p id="loginUrl">{{loginRedirectUrl}}</p>
            <button type="submit" class="btn btn-default btn-submit">Verify Your Email Account</button>
        </form>
    </div>
    <!-- forget form end here -->

    <!-- css starts here -->
    <style>
        .container.forget-form {
            max-width: 365px;
            margin-top: 100px;
        }

        .container.forget-form h3 {
            text-align: center;
            padding-top: 25px;
            padding-bottom: 20px;
        }

        button.btn-submit {
            width: 100%;
            background: #04ddd2;
            border: none;
            color: #000;
            font-weight: 600;
        }

        button.btn-submit:hover {
            background: #04ddd2;
            border: none;
            color: #000;
            font-weight: 500;
        }
    </style>

    <!-- css ends here -->

    <script>
        $(document).ready(function () {
            $("#success").hide();
            $("#error").hide();
            $('#htmlid').hide();
            $('#loginUrl').hide();
        });

        (function ($) {
            function processForm(e) {
                $.ajax({
                    url: document.getElementById('htmlid').innerText,
                    type: 'post',
                    dataType: "text",
                    contentType: 'application/x-www-form-urlencoded',
                    data: $(this).serialize(),
                    success: function (data, textStatus, jQxhr) {
                        $("#success").show();
                        $("#error").hide();
                        window.location = document.getElementById('loginUrl').innerText;
                    },
                    error: function (jqXhr, textStatus, errorThrown) {
                        let getData = JSON.parse(jqXhr.responseText);
                        document.getElementById('err').innerHTML = getData.message
                        $("#success").hide();
                        $("#error").show().fadeOut(2000);
                    }
                });
                e.preventDefault();
            }
            $('#searchForm').submit(processForm);
        })(jQuery);
    </script>
</body>

</html>
