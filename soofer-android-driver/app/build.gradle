apply plugin: 'com.android.application'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}


android {
    namespace 'com.soofer.driver'
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.soofer.driver"
        minSdkVersion 28
        targetSdkVersion 36
        ndkVersion ='29.0.13846066'
        versionCode 19
        versionName "2.0.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "StripeURL", '"https://connect.stripe.com/oauth/v2/authorize?response_type=code&client_id="'
            buildConfigField "String", "StripeKey", '"ca_KdtdAYDtmTOFx32L6fnKrsvfdWcC0ZVK"'
            buildConfigField "String", "Stripe", '"pk_live_51JvLMsD9LszUmsLxvA3vVVqJPXPCncqNSqE2RTiWDqaj0TvQPXTtyG4OqopDu68z6GEMlhcdea0HkmXsdc7pWtXM00xVZJANuo"'
        }
        debug {
            buildConfigField "String", "StripeURL", '"https://connect.stripe.com/oauth/v2/authorize?response_type=code&client_id="'
            buildConfigField "String", "StripeKey", '"ca_KdtdPkQ2a4GPlVRxb3YscDNnAWRMcIAP"'
            buildConfigField "String", "Stripe", '"pk_test_51JvLMsD9LszUmsLxMrARz8Aag0y5XeOMUnUNGzZ4oKfiyfSjnkGkGkntDJQvH3Z2nisIuNe1VsTGwJu5jPFIYljW008c1M23tQ"'
        }
    }

    dataBinding {
        enabled true
    }
    buildFeatures {
        buildConfig true
    }

    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.jvmArgs += [
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            excludes += ["**/libcronet*.so"]
            keepDebugSymbols += ["**/*.so"]
        }
        resources {
            excludes += [
                    "META-INF/rxjava.properties",
                    "META-INF/DEPENDENCIES",
                    "META-INF/NOTICE",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE.txt",
                    "dump_syms/**",
                    "dump_syms/linux/**"
            ]
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lintOptions {
        checkReleaseBuilds false // Add this
        abortOnError false
    }

}

allprojects {
    repositories {
        jcenter()
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
}
configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        if (requested.group == 'com.android.support') {
            if (!requested.name.startsWith("multidex")) {
                details.useVersion '26.0.0'
            }
        }
    }
}
allprojects {
    repositories {
        jcenter()
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            url "https://jitpack.io"
        }
        maven {
            url "https://maven.google.com" // Google's Maven repository
        }
    }
}

