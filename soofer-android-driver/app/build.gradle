    implementation 'com.github.stfalcon:smsverifycatcher:0.3.2'*/

    //latto loader
    implementation 'com.airbnb.android:lottie:3.0.0'

    implementation 'com.jakewharton.rxbinding:rxbinding:1.0.0'


    //font gradle
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'io.github.inflationx:viewpump:2.0.3'


    //sms retriver
    implementation 'com.google.android.gms:play-services-base:17.6.0'
    implementation 'com.google.android.gms:play-services-identity:17.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.2.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'

    //mobile number
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.10.17'

    implementation 'androidx.work:work-runtime:2.5.0'

    //material switch
   // implementation 'com.github.glomadrian:MaterialAnimatedSwitch:1.1@aar'

    //otp picker
    implementation 'com.github.mukeshsolanki:android-otpview-pinview:2.1.0'

    //in app update
    implementation 'com.google.android.play:core:1.10.0'

    //life cycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    //noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.3.1'

    //shimmer textview
    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'

    //zoomview
    implementation 'com.github.rahulkapoor1:ZommableLoadingImageView:v1.2'


    //stripe
    implementation 'com.stripe:stripe-android:2.0.2'

    implementation 'com.github.GwonHyeok:StickySwitch:0.0.16'


    //rxpermission
    implementation 'com.github.tbruyelle:rxpermissions:0.12'

    //splunkmint
//    implementation "com.splunk.mint:mint:4.3.0"
    //sinch call
    implementation(name: "sinch-android-rtc-3.12.3", ext: "aar")


    implementation 'com.google.firebase:firebase-crashlytics:18.3.0'
